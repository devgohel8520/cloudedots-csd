<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Reminders · CSD-CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
        :root {
            --bg: #f8f8f8;
            --surface: #fff;
            --border: #e4e4e7;
            --border-light: #f4f4f5;
            --text-1: #09090b;
            --text-2: #71717a;
            --text-3: #a1a1aa;
            --accent: #18181b;
            --accent-fg: #fafafa;
            --green: #16a34a;
            --blue: #2563eb;
            --r: 8px;
            --rl: 12px;
            --sh1: 0 1px 2px rgba(0, 0, 0, .05);
            --sh2: 0 1px 3px rgba(0, 0, 0, .08), 0 1px 2px rgba(0, 0, 0, .06);
            --sh4: 0 10px 15px -3px rgba(0, 0, 0, .08), 0 4px 6px rgba(0, 0, 0, .04);
        }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-1);
            font-size: 14px;
            min-height: 100vh
        }
        input,
        select,
        button {
            font-family: inherit
        }

        .login-gate {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: var(--bg);
            display: none;
            align-items: center;
            justify-content: center
        }
        .login-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--rl);
            box-shadow: var(--sh4);
            padding: 32px;
            width: 360px;
            max-width: 92vw
        }
        .login-box h2 {
            font-size: 18px;
            margin-bottom: 4px
        }
        .login-box p {
            font-size: 13px;
            color: var(--text-2);
            margin-bottom: 20px
        }
        .login-box .fg {
            margin-bottom: 12px
        }
        .login-box .fg label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 4px
        }
        .login-box .fg input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--r);
            font-size: 14px;
            outline: none
        }
        .login-box .fg input:focus {
            border-color: var(--accent)
        }
        .login-box .btn-primary {
            width: 100%;
            padding: 9px;
            background: var(--accent);
            color: var(--accent-fg);
            border: none;
            border-radius: var(--r);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer
        }
        .login-box .btn-primary:hover {
            opacity: .9
        }
        .login-box .err {
            color: #dc2626;
            font-size: 12px;
            margin-bottom: 12px;
            display: none
        }

        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100
        }
        .topbar h1 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-2)
        }
        .topbar-right a {
            color: var(--text-2);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px
        }
        .topbar-right a:hover {
            color: var(--accent)
        }
        .topbar .logout-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-2)
        }
        .topbar .logout-btn:hover {
            border-color: #dc2626;
            color: #dc2626
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px
        }
        .sbox {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3)
        }
        .spin {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 0 auto 12px
        }
        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .page-hd {
            margin-bottom: 20px
        }
        .page-hd h1 {
            font-size: 20px;
            font-weight: 700
        }

        .view-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 3px;
            display: inline-flex
        }
        .view-tab {
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text-3);
            border-radius: 6px;
            font-family: inherit;
            transition: all .15s
        }
        .view-tab.active {
            background: var(--accent);
            color: var(--accent-fg)
        }
        .view-tab:hover:not(.active) {
            color: var(--text-1);
            background: var(--border-light)
        }

        .nav-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap
        }
        .nav-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--r);
            background: var(--surface);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            font-family: inherit;
            transition: all .15s
        }
        .nav-btn:hover {
            border-color: var(--accent);
            color: var(--accent)
        }
        .nav-label {
            font-size: 15px;
            font-weight: 700;
            flex: 1
        }
        .nav-today {
            font-size: 12px;
            color: var(--blue);
            cursor: pointer;
            font-weight: 600;
            border: none;
            background: none;
            font-family: inherit
        }
        .nav-today:hover {
            text-decoration: underline
        }

        .filters-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--rl);
            padding: 14px 16px;
            margin-bottom: 16px;
            box-shadow: var(--sh1)
        }
        .filters-hd {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: .3px
        }
        .filter-groups {
            display: flex;
            gap: 24px;
            flex-wrap: wrap
        }
        .filter-group {
            min-width: 160px
        }
        .filter-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .3px
        }
        .filter-group .chk-list {
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px
        }
        .filter-group .chk-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer
        }
        .filter-group .chk-item input[type="checkbox"] {
            accent-color: var(--accent)
        }
        .filter-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px
        }
        .filter-actions button {
            font-size: 12px;
            padding: 3px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            cursor: pointer;
            color: var(--text-2);
            font-family: inherit
        }
        .filter-actions button:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        .cal-grid {
            display: grid;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: var(--rl);
            overflow: hidden;
            box-shadow: var(--sh1)
        }
        .cal-cell {
            background: var(--surface);
            padding: 8px;
            min-height: 80px;
            position: relative
        }
        .cal-cell.today {
            background: #f0fdf4
        }
        .cal-cell.other-month {
            opacity: .4
        }
        .cal-cell .day-num {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 4px
        }
        .cal-cell .day-num.has-rem {
            color: var(--accent)
        }
        .cal-cell .day-rem {
            font-size: 11px;
            line-height: 1.3;
            display: flex;
            flex-direction: column;
            gap: 2px
        }
        .cal-cell .day-rem a {
            cursor: pointer;
            color: var(--text-2);
            text-decoration: none;
            padding: 1px 4px;
            border-radius: 3px;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        .cal-cell .day-rem a:hover {
            background: var(--border-light);
            color: var(--text-1)
        }
        .cal-cell .day-rem .rem-type-Phone {
            border-left: 2px solid #3b82f6;
            padding-left: 4px
        }
        .cal-cell .day-rem .rem-type-Meeting {
            border-left: 2px solid #f97316;
            padding-left: 4px
        }
        .cal-cell .day-rem .rem-type-Offline\ Demo {
            border-left: 2px solid #16a34a;
            padding-left: 4px
        }
        .cal-cell .day-rem .rem-done {
            text-decoration: line-through;
            opacity: .5
        }
        .cal-cell .more-link {
            font-size: 11px;
            color: var(--blue);
            cursor: pointer;
            font-weight: 600;
            padding: 1px 4px
        }
        .cal-cell .more-link:hover {
            text-decoration: underline
        }

        .cal-hdr {
            background: var(--border-light);
            padding: 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-2);
            text-transform: uppercase;
            letter-spacing: .3px;
            text-align: center
        }

        .cal-week .cal-cell {
            min-height: 120px
        }

        .day-list {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--rl);
            box-shadow: var(--sh1);
            overflow: hidden
        }
        .day-list-item {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px
        }
        .day-list-item:last-child {
            border-bottom: none
        }
        .day-list-item:hover {
            background: var(--border-light)
        }
        .day-list-item .dl-time {
            font-weight: 600;
            color: var(--text-2);
            min-width: 50px;
            font-size: 12px
        }
        .day-list-item .dl-type {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--bg);
            font-weight: 500;
            min-width: 70px;
            text-align: center
        }
        .day-list-item .dl-type.Phone {
            background: #e0f2fe;
            color: #0369a1
        }
        .day-list-item .dl-type.Meeting {
            background: #fff7ed;
            color: #c2410c
        }
        .day-list-item .dl-type.Offline\ Demo {
            background: #f0fdf4;
            color: #166534
        }
        .day-list-item .dl-contact {
            color: var(--text-1);
            font-weight: 500;
            min-width: 120px
        }
        .day-list-item .dl-agenda {
            color: var(--text-3);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        .day-list-item .dl-status {
            font-size: 11px;
            font-weight: 600
        }
        .day-list-item .dl-status.completed {
            color: var(--green)
        }
        .day-list-item .dl-status.cancelled {
            color: #dc2626
        }
        .day-list-item .dl-status.pending {
            color: #a16207
        }
        .day-list-item .dl-detail {
            font-size: 11px;
            color: var(--text-3)
        }

        .rem-count {
            font-size: 12px;
            color: var(--text-3);
            margin-top: 2px
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px
        }
        .year-month {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--rl);
            padding: 14px;
            box-shadow: var(--sh1)
        }
        .year-month h3 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px
        }
        .year-month .ym-rem {
            font-size: 12px;
            color: var(--text-2);
            padding: 2px 0;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between
        }
        .year-month .ym-rem:last-child {
            border-bottom: none
        }
        .year-month .ym-rem .ym-count {
            font-weight: 600;
            color: var(--text-1)
        }
        .year-month .ym-empty {
            font-size: 12px;
            color: var(--text-3)
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3)
        }
        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: .4
        }

        .toast-wrap {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none
        }
        .toast {
            background: #18181b;
            color: #fafafa;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--sh4);
            pointer-events: auto;
            animation: ti .3s ease
        }
        .toast.err {
            background: #dc2626
        }
        @keyframes ti {
            from {
                opacity: 0;
                transform: translateY(12px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .hidden {
            display: none !important
        }

        @media (max-width: 700px) {
            .filter-groups {
                flex-direction: column;
                gap: 12px
            }
            .filter-group {
                min-width: auto
            }
            .cal-week .cal-cell {
                min-height: 80px
            }
            .year-grid {
                grid-template-columns: 1fr 1fr
            }
            .container {
                padding: 12px
            }
            .day-list-item {
                flex-wrap: wrap
            }
            .day-list-item .dl-agenda {
                width: 100%;
                order: 10
            }
        }

        #reminderModal {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, .4);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px
        }
        #reminderModal.open {
            display: flex
        }
        #reminderModal .modal-box {
            background: var(--surface);
            border-radius: var(--rl);
            max-width: 480px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--sh4)
        }
        #reminderModal .modal-hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 15px
        }
        #reminderModal .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-3);
            padding: 4px;
            line-height: 1
        }
        #reminderModal .modal-close:hover {
            color: var(--text-1)
        }
        #reminderModal .modal-body {
            padding: 16px
        }
        #reminderModal .modal-body .rm-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px
        }
        #reminderModal .modal-body .rm-label {
            font-weight: 600;
            color: var(--text-2);
            min-width: 90px;
            flex-shrink: 0
        }
        #reminderModal .modal-body .rm-value {
            color: var(--text-1);
            flex: 1
        }
        #reminderModal .modal-body .rm-divider {
            border: none;
            border-top: 1px solid var(--border-light);
            margin: 10px 0
        }
    </style>
</head>

<body>

    <!-- ═══════════════════════════ LOGIN GATE ════════════════════════════ -->
    <div class="login-gate" id="loginGate">
        <div class="login-box">
            <h2>Reminders Calendar</h2>
            <p>Sign in to continue</p>
            <div class="err" id="loginErr">Invalid email or password</div>
            <div class="fg"><label>Email</label><input id="loginEmail" type="email" placeholder="dev@cloudedots.com"></div>
            <div class="fg"><label>Password</label><input id="loginPass" type="password" placeholder="Password"></div>
            <button class="btn-primary" onclick="doLogin()">Sign In</button>
        </div>
    </div>

    <!-- ═══════════════════════════ TOPBAR ═════════════════════════════════ -->
    <div class="topbar">
        <h1>📅 Reminders Calendar</h1>
        <div class="topbar-right">
            <span class="user-badge" id="userInfo"></span>
            <a href="/">← Back to Dashboard</a>
            <button class="logout-btn" onclick="doLogout()">Logout</button>
        </div>
    </div>

    <!-- ═══════════════════════════ CONTENT ════════════════════════════════ -->
    <div class="container" id="mainContent">

        <div class="page-hd">
            <h1>Reminders</h1>
            <div class="rem-count" id="totalCount">Loading…</div>
        </div>

        <!-- view tabs -->
        <div class="view-tabs" id="viewTabs">
            <button class="view-tab active" onclick="switchView('daily',this)">Daily</button>
            <button class="view-tab" onclick="switchView('weekly',this)">Weekly</button>
            <button class="view-tab" onclick="switchView('monthly',this)">Monthly</button>
            <button class="view-tab" onclick="switchView('yearly',this)">Yearly</button>
        </div>

        <!-- navigation -->
        <div class="nav-bar">
            <button class="nav-btn" onclick="nav(-1)">← Prev</button>
            <span class="nav-label" id="navLabel"></span>
            <button class="nav-btn" onclick="nav(1)">Next →</button>
            <button class="nav-today" onclick="goToday()">Today</button>
        </div>

        <!-- filters -->
        <div class="filters-bar">
            <div class="filters-hd">Filters</div>
            <div class="filter-groups">
                <div class="filter-group">
                    <label>User Name</label>
                    <div class="chk-list" id="userFilterList"></div>
                </div>
                <div class="filter-group">
                    <label>Reminder Type</label>
                    <div class="chk-list" id="typeFilterList"></div>
                </div>
            </div>
            <div class="filter-actions">
                <button onclick="selectAllFilters()">Select All</button>
                <button onclick="clearFilters()">Clear</button>
            </div>
        </div>

        <!-- calendar content -->
        <div id="calContent"><div class="sbox"><div class="spin"></div><p>Loading reminders…</p></div></div>

    </div>

    <!-- ═══════════════════════════ REMINDER DETAIL MODAL ══════════════════ -->
    <div id="reminderModal">
        <div class="modal-box">
            <div class="modal-hd">
                <span>Reminder Details</span>
                <button class="modal-close" onclick="closeRemModal()">&times;</button>
            </div>
            <div class="modal-body" id="remModalBody"></div>
            <div class="modal-hd" style="justify-content:center;gap:8px;border-top:1px solid var(--border);padding:10px 16px">
                <button class="btn btn-default" onclick="closeRemModal()">Close</button>
                <button class="btn btn-primary" id="remEditBtn" onclick="editRemFromDetail()">✏️ Edit</button>
            </div>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script>
        var _user = null;
        var allReminders = [];
        var allUsers = [];
        var currentView = 'daily';
        var currentDate = new Date();
        var TYPE_COLORS = { Phone: '#3b82f6', Meeting: '#f97316', 'Offline Demo': '#16a34a' };
        var TYPE_ICONS = { Phone: '📞', Meeting: '🤝', 'Offline Demo': '🏢' };

        var activeUserFilters = null;
        var activeTypeFilters = null;

        function toast(msg, err) {
            var w = document.getElementById('toastWrap');
            var el = document.createElement('div');
            el.className = 'toast' + (err ? ' err' : '');
            el.textContent = msg;
            w.appendChild(el);
            setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(function () { el.remove(); }, 300); }, 3000);
        }

        function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        function call(fn, args, ok, fail) {
            fetch('/api/crm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fn: fn, args: args || [], user: _user })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data && data.error) { if (fail) fail(data.error); else toast(data.error, true); return; }
                if (ok) ok(data && data.result !== undefined ? data.result : data);
            })
            .catch(function (e) { if (fail) fail(e.message); else toast('Error: ' + e.message, true); });
        }

        // ─── Data loading ───────────────────────────────────────────────────

        function loadData() {
            call('getAllReminders', [], function (list) {
                allReminders = list || [];
                buildFilters();
                render();
            }, function () {
                document.getElementById('calContent').innerHTML = '<div class="sbox"><p style="color:#dc2626">Failed to load reminders</p></div>';
            });
            call('getUsers', [], function (users) {
                allUsers = users || [];
                buildFilters();
            });
        }

        // ─── Filters ────────────────────────────────────────────────────────

        function buildFilters() {
            // User filter
            var userSet = {};
            for (var i = 0; i < allReminders.length; i++) {
                var u = allReminders[i].user_name;
                if (u) userSet[u] = true;
                var g = allReminders[i].guest_user_name;
                if (g) userSet[g] = true;
            }
            var userKeys = Object.keys(userSet).sort();
            // also include all Piplhr users
            for (var i = 0; i < allUsers.length; i++) {
                if (userKeys.indexOf(allUsers[i].name) < 0) userKeys.push(allUsers[i].name);
            }
            userKeys.sort();

            var userHtml = '';
            if (activeUserFilters === null) activeUserFilters = {};
            for (var i = 0; i < userKeys.length; i++) {
                var name = userKeys[i];
                if (activeUserFilters[name] === undefined) activeUserFilters[name] = true;
                userHtml += '<label class="chk-item"><input type="checkbox" class="uf" value="' + esc(name) + '" ' + (activeUserFilters[name] ? 'checked' : '') + ' onchange="onFilterChange()">' + esc(name) + '</label>';
            }
            document.getElementById('userFilterList').innerHTML = userHtml || '<span style="font-size:12px;color:var(--text-3)">No users</span>';

            // Type filter
            var typeKeys = ['Phone', 'Meeting', 'Offline Demo'];
            var typeHtml = '';
            if (activeTypeFilters === null) activeTypeFilters = {};
            for (var i = 0; i < typeKeys.length; i++) {
                var t = typeKeys[i];
                if (activeTypeFilters[t] === undefined) activeTypeFilters[t] = true;
                typeHtml += '<label class="chk-item"><input type="checkbox" class="tf" value="' + t + '" ' + (activeTypeFilters[t] ? 'checked' : '') + ' onchange="onFilterChange()">' + t + '</label>';
            }
            document.getElementById('typeFilterList').innerHTML = typeHtml;
        }

        function getActiveFilters() {
            var users = {};
            document.querySelectorAll('.uf:checked').forEach(function (el) { users[el.value] = true; });
            var types = {};
            document.querySelectorAll('.tf:checked').forEach(function (el) { types[el.value] = true; });
            return { users: users, types: types };
        }

        function onFilterChange() {
            var f = getActiveFilters();
            activeUserFilters = f.users;
            activeTypeFilters = f.types;
            render();
        }

        function selectAllFilters() {
            document.querySelectorAll('.uf, .tf').forEach(function (el) { el.checked = true; });
            onFilterChange();
        }

        function clearFilters() {
            document.querySelectorAll('.uf, .tf').forEach(function (el) { el.checked = false; });
            onFilterChange();
        }

        function getFilteredReminders() {
            var f = getActiveFilters();
            return allReminders.filter(function (r) {
                if (!f.types[r.type]) return false;
                if (Object.keys(f.users).length > 0) {
                    var hasUser = r.user_name && f.users[r.user_name];
                    var hasGuest = r.guest_user_name && f.users[r.guest_user_name];
                    if (!hasUser && !hasGuest) return false;
                }
                return true;
            });
        }

        // ─── View switching & navigation ────────────────────────────────────

        function switchView(view, btn) {
            currentView = view;
            document.querySelectorAll('.view-tab').forEach(function (t) { t.classList.remove('active'); });
            if (btn) btn.classList.add('active');
            render();
        }

        function nav(dir) {
            var d = new Date(currentDate);
            if (currentView === 'daily') d.setDate(d.getDate() + dir);
            else if (currentView === 'weekly') d.setDate(d.getDate() + dir * 7);
            else if (currentView === 'monthly') d.setMonth(d.getMonth() + dir);
            else if (currentView === 'yearly') d.setFullYear(d.getFullYear() + dir);
            currentDate = d;
            render();
        }

        function goToday() {
            currentDate = new Date();
            render();
        }

        function pad(n) { return String(n).padStart(2, '0'); }

        function fmtDate(d) {
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        // ─── Render ─────────────────────────────────────────────────────────

        function render() {
            var list = getFilteredReminders();
            document.getElementById('totalCount').textContent = list.length + ' reminder' + (list.length !== 1 ? 's' : '');

            var html = '';
            if (currentView === 'daily') html = renderDaily(list);
            else if (currentView === 'weekly') html = renderWeekly(list);
            else if (currentView === 'monthly') html = renderMonthly(list);
            else if (currentView === 'yearly') html = renderYearly(list);

            document.getElementById('calContent').innerHTML = html;
        }

        // ─── Daily view ─────────────────────────────────────────────────────

        function renderDaily(list) {
            var ds = fmtDate(currentDate);
            var dow = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][currentDate.getDay()];
            document.getElementById('navLabel').textContent = dow + ', ' + currentDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

            var dayList = list.filter(function (r) { return r.date === ds; });
            dayList.sort(function (a, b) { return (a.time || '').localeCompare(b.time || ''); });

            if (dayList.length === 0) {
                return '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><p>No reminders for this day</p></div>';
            }

            var html = '<div class="day-list">';
            for (var i = 0; i < dayList.length; i++) {
                var r = dayList[i];
                var statusClass = r.status === 'Completed' ? 'completed' : r.status === 'Cancelled' ? 'cancelled' : 'pending';
                var statusLbl = r.status === 'Completed' ? '✅ Done' : r.status === 'Cancelled' ? '❌ Cancelled' : '⏰ ' + (isOverdue(r.date, r.time, r.status) ? 'Overdue' : 'Pending');
                var detail = '';
                if (r.meeting_location) detail += '📍 ' + esc(r.meeting_location) + ' ';
                if (r.map_link) detail += '🗺️ <a href="' + esc(r.map_link) + '" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:underline" onclick="event.stopPropagation()">Map</a> ';
                if (r.user_name) detail += '👤 ' + esc(r.user_name) + ' ';
                if (r.guest_user_name) detail += '👤 Guest: ' + esc(r.guest_user_name) + ' ';
                html += '<div class="day-list-item" onclick="openRemDetail(' + r.id + ')">' +
                    '<span class="dl-time">' + esc(r.time || '—') + '</span>' +
                    '<span class="dl-type ' + r.type.replace(/\s+/g, '\\ ') + '">' + (TYPE_ICONS[r.type] || '') + ' ' + esc(r.type) + '</span>' +
                    '<span class="dl-contact">' + esc(r.contactName || '') + '</span>' +
                    '<span class="dl-agenda">' + esc(r.agenda || '') + '</span>' +
                    '<span class="dl-status ' + statusClass + '">' + statusLbl + '</span>' +
                    (detail ? '<span class="dl-detail">' + detail + '</span>' : '') +
                    '</div>';
            }
            html += '</div>';
            return html;
        }

        // ─── Weekly view ────────────────────────────────────────────────────

        function renderWeekly(list) {
            var start = new Date(currentDate);
            start.setDate(start.getDate() - start.getDay());
            var end = new Date(start);
            end.setDate(end.getDate() + 6);

            document.getElementById('navLabel').textContent = start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' + end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            var html = '<div class="cal-grid cal-week" style="grid-template-columns:repeat(7,1fr)">';
            var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            for (var di = 0; di < 7; di++) {
                html += '<div class="cal-hdr">' + days[di] + '</div>';
            }
            var todayStr = fmtDate(new Date());
            for (var di = 0; di < 7; di++) {
                var d = new Date(start);
                d.setDate(d.getDate() + di);
                var ds = fmtDate(d);
                var isToday = ds === todayStr;
                var dayList = list.filter(function (r) { return r.date === ds; });
                dayList.sort(function (a, b) { return (a.time || '').localeCompare(b.time || ''); });
                html += '<div class="cal-cell' + (isToday ? ' today' : '') + '">';
                html += '<div class="day-num' + (dayList.length > 0 ? ' has-rem' : '') + '">' + d.getDate() + '</div>';
                html += '<div class="day-rem">';
                var maxShow = 3;
                for (var ri = 0; ri < Math.min(dayList.length, maxShow); ri++) {
                    var r = dayList[ri];
                    var doneCls = r.status === 'Completed' || r.status === 'Cancelled' ? ' rem-done' : '';
                    html += '<a class="rem-type-' + esc(r.type.replace(/\s+/g, '\\\\ ')) + doneCls + '" onclick="openRemDetail(' + r.id + ')">' + esc(r.contactName || '?') + ' ' + esc(r.time || '') + '</a>';
                }
                if (dayList.length > maxShow) {
                    html += '<span class="more-link" onclick="switchView(\'daily\'); setDate(\'' + ds + '\')">+' + (dayList.length - maxShow) + ' more</span>';
                }
                html += '</div></div>';
            }
            html += '</div>';
            return html;
        }

        // ─── Monthly view ───────────────────────────────────────────────────

        function renderMonthly(list) {
            var year = currentDate.getFullYear();
            var month = currentDate.getMonth();
            document.getElementById('navLabel').textContent = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            var first = new Date(year, month, 1);
            var last = new Date(year, month + 1, 0);
            var startPad = first.getDay();
            var totalDays = last.getDate();
            var todayStr = fmtDate(new Date());

            var html = '<div class="cal-grid" style="grid-template-columns:repeat(7,1fr)">';
            var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            for (var di = 0; di < 7; di++) {
                html += '<div class="cal-hdr">' + days[di] + '</div>';
            }

            // previous month padding
            var prevLast = new Date(year, month, 0);
            var prevDays = prevLast.getDate();
            for (var pi = startPad - 1; pi >= 0; pi--) {
                html += '<div class="cal-cell other-month"><div class="day-num">' + (prevDays - pi) + '</div></div>';
            }

            for (var d = 1; d <= totalDays; d++) {
                var dateObj = new Date(year, month, d);
                var ds = fmtDate(dateObj);
                var isToday = ds === todayStr;
                var dayList = list.filter(function (r) { return r.date === ds; });
                html += '<div class="cal-cell' + (isToday ? ' today' : '') + '">';
                html += '<div class="day-num' + (dayList.length > 0 ? ' has-rem' : '') + '" onclick="switchView(\'daily\'); setDate(\'' + ds + '\')" style="cursor:pointer">' + d + '</div>';
                html += '<div class="day-rem">';
                var maxShow = 2;
                for (var ri = 0; ri < Math.min(dayList.length, maxShow); ri++) {
                    var r = dayList[ri];
                    var doneCls = r.status === 'Completed' || r.status === 'Cancelled' ? ' rem-done' : '';
                    html += '<a class="rem-type-' + esc(r.type.replace(/\s+/g, '\\\\ ')) + doneCls + '" onclick="openRemDetail(' + r.id + ')">' + esc(r.contactName || '?') + '</a>';
                }
                if (dayList.length > maxShow) {
                    html += '<span class="more-link" onclick="switchView(\'daily\'); setDate(\'' + ds + '\')">+' + (dayList.length - maxShow) + '</span>';
                }
                html += '</div></div>';
            }

            // next month padding
            var endPad = 7 - ((startPad + totalDays) % 7);
            if (endPad < 7) {
                for (var ni = 1; ni <= endPad; ni++) {
                    html += '<div class="cal-cell other-month"><div class="day-num">' + ni + '</div></div>';
                }
            }

            html += '</div>';
            return html;
        }

        // ─── Yearly view ────────────────────────────────────────────────────

        function renderYearly(list) {
            var year = currentDate.getFullYear();
            document.getElementById('navLabel').textContent = String(year);

            var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            var html = '<div class="year-grid">';
            for (var m = 0; m < 12; m++) {
                var mList = list.filter(function (r) {
                    return r.date && r.date.indexOf(year + '-' + pad(m + 1)) === 0;
                });
                // group by date
                var dateCounts = {};
                for (var ri = 0; ri < mList.length; ri++) {
                    var d = mList[ri].date;
                    if (!dateCounts[d]) dateCounts[d] = { count: 0, completed: 0 };
                    dateCounts[d].count++;
                    if (mList[ri].status === 'Completed') dateCounts[d].completed++;
                }
                var totalRem = mList.length;
                var daysWithRem = Object.keys(dateCounts).length;

                html += '<div class="year-month" onclick="switchView(\'monthly\'); setMonth(' + year + ',' + (m + 1) + ')" style="cursor:pointer">';
                html += '<h3>' + monthNames[m] + '</h3>';
                if (totalRem === 0) {
                    html += '<div class="ym-empty">No reminders</div>';
                } else {
                    html += '<div class="ym-rem"><span>Total reminders</span><span class="ym-count">' + totalRem + '</span></div>';
                    html += '<div class="ym-rem"><span>Days with reminders</span><span class="ym-count">' + daysWithRem + '</span></div>';
                }
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        // ─── Helpers ────────────────────────────────────────────────────────

        function isOverdue(dateStr, timeStr, status) {
            if (status === 'Completed' || status === 'Cancelled') return false;
            if (!dateStr) return false;
            var parts = dateStr.split('-');
            var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
            if (timeStr) {
                var tp = timeStr.split(':');
                d.setHours(+tp[0], +tp[1]);
            }
            return d < new Date();
        }

        function setDate(ds) {
            var parts = ds.split('-');
            currentDate = new Date(+parts[0], +parts[1] - 1, +parts[2]);
            render();
        }

        function setMonth(year, month) {
            currentDate = new Date(year, month - 1, 1);
            render();
        }

        // ─── Reminder detail modal ──────────────────────────────────────────

        var _currentRemDetailId = null;

        function openRemDetail(id) {
            _currentRemDetailId = id;
            var r = null;
            for (var i = 0; i < allReminders.length; i++) {
                if (allReminders[i].id === id) { r = allReminders[i]; break; }
            }
            if (!r) { toast('Reminder not found', true); return; }

            var statusLbl = r.status === 'Completed' ? '✅ Completed' : r.status === 'Cancelled' ? '❌ Cancelled' : isOverdue(r.date, r.time, r.status) ? '⏰ Overdue' : '⏰ Pending';
            var html = '';
            html += '<div class="rm-row"><span class="rm-label">Contact</span><span class="rm-value">' + esc(r.contactName || '') + '</span></div>';
            html += '<div class="rm-row"><span class="rm-label">Type</span><span class="rm-value">' + (TYPE_ICONS[r.type] || '') + ' ' + esc(r.type || '') + '</span></div>';
            html += '<div class="rm-row"><span class="rm-label">Date</span><span class="rm-value">' + esc(r.date || '') + '</span></div>';
            html += '<div class="rm-row"><span class="rm-label">Time</span><span class="rm-value">' + esc(r.time || '') + '</span></div>';
            html += '<div class="rm-row"><span class="rm-label">Status</span><span class="rm-value">' + statusLbl + '</span></div>';
            html += '<hr class="rm-divider">';
            html += '<div class="rm-row"><span class="rm-label">Agenda</span><span class="rm-value">' + esc(r.agenda || '') + '</span></div>';
            if (r.meeting_location) html += '<div class="rm-row"><span class="rm-label">Location</span><span class="rm-value">📍 ' + esc(r.meeting_location) + '</span></div>';
            if (r.map_link) html += '<div class="rm-row"><span class="rm-label">Map</span><span class="rm-value">🗺️ <a href="' + esc(r.map_link) + '" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:underline">Open in Google Maps</a></span></div>';
            if (r.user_name) html += '<div class="rm-row"><span class="rm-label">User</span><span class="rm-value">👤 ' + esc(r.user_name) + '</span></div>';
            if (r.guest_user_name) html += '<div class="rm-row"><span class="rm-label">Guest</span><span class="rm-value">👤 ' + esc(r.guest_user_name) + '</span></div>';
            html += '<hr class="rm-divider">';
            html += '<div class="rm-row"><span class="rm-label">Created by</span><span class="rm-value">' + esc(r.createdBy || '—') + '</span></div>';

            document.getElementById('remModalBody').innerHTML = html;
            document.getElementById('reminderModal').classList.add('open');
        }

        function closeRemModal() {
            document.getElementById('reminderModal').classList.remove('open');
            _currentRemDetailId = null;
        }

        function editRemFromDetail() {
            if (_currentRemDetailId) {
                window.location.href = 'index.html?editReminder=' + _currentRemDetailId;
            }
        }

        // close modal on backdrop click
        document.getElementById('reminderModal').addEventListener('click', function (e) {
            if (e.target === this) closeRemModal();
        });

        // ─── Login ──────────────────────────────────────────────────────────

        function doLogin() {
            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPass').value;
            document.getElementById('loginErr').style.display = 'none';
            call('login', [email, password], function (u) {
                if (!u) { document.getElementById('loginErr').style.display = 'block'; return; }
                _user = u;
                try { localStorage.setItem('crm_user', JSON.stringify(u)); } catch (e) { }
                document.getElementById('loginGate').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('userInfo').textContent = _user.name + ' (' + _user.role + ')';
                loadData();
            }, function () { document.getElementById('loginErr').style.display = 'block'; });
        }

        function doLogout() {
            _user = null;
            try { localStorage.removeItem('crm_user'); } catch (e) { }
            document.getElementById('loginGate').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
        }

        // ─── Init ───────────────────────────────────────────────────────────

        (function () {
            var saved = localStorage.getItem('crm_user');
            if (saved) {
                _user = JSON.parse(saved);
                document.getElementById('loginGate').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('userInfo').textContent = _user.name + ' (' + _user.role + ')';
                loadData();
            }
        })();
    </script>
</body>

</html>
